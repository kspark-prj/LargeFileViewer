[package]
name = "large_file_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "large_file_core"
crate-type = ["cdylib"]

[dependencies]
memmap2 = "0.9.4"
memchr = "2.7.1"
rayon = "1.8.1"
regex = "1.10.3"

[dependencies.pyo3]
version = "0.23.3"
features = ["extension-module"]

# 🚀 바이너리 속도 극대화를 위한 Release 프로필 설정 (추가 권장)
[profile.release]
opt-level = 3         # 최고 수준의 코드 최적화 적용
lto = true            # Link-Time Optimization (모듈 간 불필요한 루프/함수 호출 제거)
codegen-units = 1     # 코드 생성 단위를 1개로 줄여 LTO 최적화 효율 극대화
panic = "abort"       # 스택 언와인딩 제거로 바이너리 크기 줄이고 실행 속도 가속
